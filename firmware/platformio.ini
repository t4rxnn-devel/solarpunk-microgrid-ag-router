; ==============================================================================
; PlatformIO Project Configuration File
; Project: solarpunk-microgrid-ag-router
; Repository: t4rxnn-devel/solarpunk-microgrid-ag-router
; ==============================================================================
; Description: Universal multi-target build manifest for industrial edge nodes,
;              MPPT solar power chargers, and autonomous agricultural pumps.
; ==============================================================================

[platformio]
default_envs = teensy41_prod
src_dir = src
include_dir = include
test_dir = test
data_dir = data

; ==============================================================================
; Base Shared Environment Configuration
; ==============================================================================
[env]
framework = arduino
monitor_speed = 500000
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -O3
    -DCORE_TEENSY
    -DUSBCON
    -DUSB_SERIAL
    -DHAL_POWER_ROUTER_ENABLED
    -DMAX_SOLAR_INPUT_VOLTAGE_V=60.0
    -DMAX_SYSTEM_CURRENT_A=30.0
    -DPWM_SWITCHING_FREQUENCY_HZ=50000
    -DADC_RESOLUTION_BITS=12
    -DSAFETY_WATCHDOG_TIMEOUT_MS=100
    -DENABLE_HARDWARE_FAULT_LATCH=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ftrias/TeensyThreads @ ^3.1.0
    arduino-libraries/Ethernet @ ^2.0.2

; ==============================================================================
; Target Environment 1: Teensy 4.1 Industrial Production Node
; ==============================================================================
[env:teensy41_prod]
platform = teensy
board = teensy41
build_flags = 
    ${env.build_flags}
    -DTEENSY_TARGET_HW=41
    -DARM_MATH_CM7
    -D__FPU_PRESENT=1
    -DMPU_PROTECTION_ENABLED=1
    -DDIAGNOSTIC_LED_PIN=13
    -DRELAY_LATCH_PIN=32
    -DPWM_GATE_PIN=6
    -DSENS_VIN_PIN=A0
    -DSENS_IIN_PIN=A1
    -DSENS_BUS_PIN=A2

lib_deps = 
    ${env.lib_deps}

; ==============================================================================
; Target Environment 2: ESP32-S3 Wireless Edge Telemetry & Nanogrid Node
; ==============================================================================
[env:esp32s3_wireless]
platform = espressif32
board = esp32s3box
build_flags = 
    ${env.build_flags}
    -DARDUINO_ESP32S3_DEV
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_TELEMETRY_ENABLED=1
    -DPWM_GATE_PIN=GPIO_NUM_18
    -DSENS_VIN_PIN=GPIO_NUM_1
    -DSENS_IIN_PIN=GPIO_NUM_2
    -DSENS_BUS_PIN=GPIO_NUM_4

lib_deps =
    ${env.lib_deps}
    espharma/Preferences @ ^2.1.0

; ==============================================================================
; Target Environment 3: STM32F407 High-Reliability Power Controller
; ==============================================================================
[env:stm32f407_industrial]
platform = ststm32
board = black_f407zg
build_flags = 
    ${env.build_flags}
    -DSTM32F407xx
    -DHAL_STM32_MODULE_ENABLED
    -DPWM_GATE_PIN=PE9
    -DSENS_VIN_PIN=PA0
    -DSENS_IIN_PIN=PA1
    -DSENS_BUS_PIN=PA2

lib_deps =
    ${env.lib_deps}

; ==============================================================================
; Target Environment 4: Hardware-in-the-Loop Simulation Unit Test Harness
; ==============================================================================
[env:native_simulation]
platform = native
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -g
    -DNATIVE_TEST_ENVIRONMENT=1
    -DUNIT_TESTING=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; ==============================================================================
; Custom Build Script Post-Processing Hooks & Automation Rules
; ==============================================================================
extra_scripts = pre:scripts/validate_environment.py
